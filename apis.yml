aid: flash-app
name: Flash App
description: 'Flash (Flash Tecnologia) is a Sao Paulo based Brazilian HR and financial
  management platform that centralizes three surfaces on one account: multi-benefits
  (the Flash prepaid benefits card and PAT-compliant meal, food, mobility and wellness
  balances), people management (admissions and offboarding, time and attendance, recruiting,
  performance and engagement, extended by its FolhaCerta acquisition), and corporate
  expense management (corporate cards, receipt capture and reimbursement, from its
  2022 ExpenseON acquisition). Founded by Ricardo Salem, Pedro Lane and Guilherme
  Lane, it launched in 2019 and reports more than 60,000 client companies, 1.5 million
  users and over R$10 billion in processed transactions. Its public developer surface
  is small: a ReadMe-hosted API reference covering the Flash Expense integration API
  (login and user provisioning against the expenseon.com hosts), with the Flash Beneficios
  reference still an unfilled template.'
