  update:
    x-apievangelist-note: >-
      The published definition declares only the QA host. The production Flash
      Expense application runs at app.expenseon.com; confirm the production API
      base path with Flash before switching environments.
- target: $.paths['/login'].post
  update:
    tags:
    - Authentication
    description: >-
      Exchange integration-user credentials for a Flash Expense session
      credential. The token format, lifetime and transport header are not
      documented in the published definition.
    x-apievangelist-action-class: acting
    x-apievangelist-consequence: write
- target: $.paths['/integration/user'].post
  update:
    tags:
    - Users
    summary: Create or update an employee in Flash Expense
    description: >-
      Provision an employee into Flash Expense with profile, subsidiary, area,
      job position, manager, cost centre and banking data. Organisational
      objects are referenced by external reference strings (refSubsidiary,
      refJobPosition, refCostCenter, refManager).
    x-apievangelist-action-class: acting
    x-apievangelist-consequence: write
    x-apievangelist-note: >-
      This operation carries employee banking data; treat it as personal data
      under Brazil's LGPD.
